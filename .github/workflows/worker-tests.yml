name: Worker tests

# Runs the Cloudflare Worker's vitest suite on every PR that touches
# worker/** and on pushes to main. Tests stub `fetch` so they never
# hit the real Anthropic / ElevenLabs / AssemblyAI upstreams — see
# docs/specs/14-testing-strategy.md §"Open questions #5".
on:
  pull_request:
    paths:
      - 'worker/**'
  push:
    branches: [main]
    paths:
      - 'worker/**'

jobs:
  vitest:
    name: Vitest (Cloudflare Worker)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'worker/package-lock.json'

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run vitest
        working-directory: worker
        run: npm run test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: worker/coverage/
          if-no-files-found: ignore
